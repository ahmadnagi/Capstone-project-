<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="700.css">
<link rel="stylesheet" href="900.css">
<style>
  :root { --bg:#0d0f13; --ink:#ffffff; --dim:#8a8f98; --lime:#c6ff3d; --red:#ff4d4d; --card:#1a1d24; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:1080px; height:1920px; overflow:hidden; background:var(--bg); font-family:'Cairo', sans-serif; color:var(--ink); }
  #bgglow { position:absolute; inset:0; }
  /* Safe zone: y 230..1440, keep right 230px clear -> content box x 60..850 */
  #safe { position:absolute; left:60px; top:230px; width:790px; height:1210px; }
  #visual { position:absolute; left:0; top:60px; width:790px; height:640px; display:flex; align-items:center; justify-content:center; }
  #caption { position:absolute; left:0; top:760px; width:790px; height:330px; display:flex; flex-wrap:wrap; align-content:center; justify-content:center; gap:4px 18px; text-align:center; font-weight:900; font-size:76px; line-height:1.25; }
  .w { display:inline-block; }
  .hl { color:var(--lime); }
  #progress { position:absolute; left:60px; top:240px; width:790px; height:8px; border-radius:4px; background:#232733; overflow:hidden; }
  #progress > div { position:absolute; right:0; top:0; height:100%; background:var(--lime); }
  #brand { position:absolute; left:60px; top:1370px; width:790px; text-align:center; font-weight:700; font-size:30px; letter-spacing:6px; color:var(--dim); direction:ltr; }
  .big { font-weight:900; direction:ltr; line-height:1; }
  .lbl { font-weight:700; color:var(--dim); font-size:44px; }
  .dot { width:46px; height:46px; border-radius:50%; border:5px solid #3a3f4b; display:inline-block; }
  .chip { font-weight:900; font-size:110px; width:170px; height:170px; border-radius:36px; background:var(--card); display:flex; align-items:center; justify-content:center; direction:ltr; }
</style>
</head>
<body>
<div id="bgglow"></div>
<div id="progress"><div id="pbar"></div></div>
<div id="safe">
  <div id="visual"></div>
  <div id="caption"></div>
</div>
<div id="brand">COACH NAGI</div>
<script>
const WPM = 130;
// [spoken line, words to highlight]
const BEATS = [
  ["مش لازم تمانية لاتناشر عدة.", ["تمانية","لاتناشر"]],
  ["كلنا اتعلمنا إن ده رقم التضخيم.", ["التضخيم."]],
  ["بس الأبحاث بتقول:", ["الأبحاث"]],
  ["من ست عدات لتلاتين عدة،", ["ست","لتلاتين"]],
  ["كلهم بيبنوا عضل.", ["عضل."]],
  ["بشرط واحد.", ["واحد."]],
  ["تكمل المجموعة لحد ما يفضلك عدة أو اتنين.", ["عدة","اتنين."]],
  ["لو بتلعب اتناشر وكان ممكن تكمل عشرين،", ["اتناشر","عشرين،"]],
  ["دي مش مجموعة. دي تسخين.", ["تسخين."]],
  ["الفرق مش في الرقم.", ["الرقم."]],
  ["الفرق في آخر عدتين.", ["آخر","عدتين."]],
  ["فحاول دايماً تختار الرقم اللي مرتاح فيه.", ["مرتاح"]],
  ["ست، عشرة، خمستاشر، عشرين.", []],
  ["مش لازم تمانية لاتناشر.", ["تمانية","لاتناشر."]],
  ["لازم آخر عدتين يبقوا صعبين.", ["صعبين."]],
];
let t0 = 0;
const T = BEATS.map(([s, h]) => { const n = s.split(/\s+/).length, d = n / WPM * 60; const b = {s, h, start:t0, dur:d, n}; t0 += d; return b; });
const TOTAL = t0 + 0.6;
window.TOTAL = TOTAL;

const clamp = (x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease = x => { x = clamp(x); return 1 - Math.pow(1 - x, 3); };
const back = x => { x = clamp(x); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3*Math.pow(x-1,3) + c1*Math.pow(x-1,2); };
const pop = (lt, at=0, d=0.35) => { const p = back((lt-at)/d); return `opacity:${clamp((lt-at)/0.12)};transform:scale(${0.6+0.4*p});`; };
const rise = (lt, at=0, d=0.35) => { const p = ease((lt-at)/d); return `opacity:${p};transform:translateY(${(1-p)*40}px);`; };

function caption(i, t) {
  const b = T[i], lt = t - b.start, per = b.dur / b.n;
  return b.s.split(/\s+/).map((w, k) => {
    const p = back((lt - k*per) / 0.25), o = clamp((lt - k*per) / 0.1);
    return `<span class="w ${b.h.includes(w) ? 'hl' : ''}" style="opacity:${o};transform:translateY(${(1-p)*30}px) scale(${0.85+0.15*p})">${w}</span>`;
  }).join(' ');
}
const S = i => T[i].start;

function dots(n, filled, redFrom, lt, glowT) {
  let h = '';
  for (let k = 0; k < n; k++) {
    let st = '';
    if (k < filled) st = 'background:var(--lime);border-color:var(--lime);';
    if (redFrom != null && k >= redFrom) {
      const pulse = 1 + 0.12*Math.sin(glowT*10);
      st = `background:var(--red);border-color:var(--red);box-shadow:0 0 30px var(--red);transform:scale(${pulse});`;
    }
    h += `<span class="dot" style="${st}"></span>`;
  }
  return `<div style="display:flex;gap:16px;direction:ltr;justify-content:center;width:790px">${h}</div>`;
}

function strike812(lt, label) {
  const sp = ease((lt-0.35)/0.45);
  return `<div style="display:flex;flex-direction:column;align-items:center;gap:20px;${pop(lt)}">
    ${label}
    <div style="position:relative">
      <div class="big" style="font-size:300px">8–12</div>
      <div style="position:absolute;left:-20px;top:46%;height:26px;width:${sp*110}%;background:var(--red);border-radius:13px;transform:rotate(-8deg);box-shadow:0 0 40px rgba(255,77,77,.6)"></div>
    </div>
    <div class="lbl">عدة</div></div>`;
}

function visual(t) {
  // Scene A: hook + "rep range of hypertrophy"
  if (t < S(2)) {
    const lt = t;
    const q = t >= S(1) ? `<div class="lbl" style="font-size:56px;color:var(--ink);${rise(t-S(1))}">رقم التضخيم<span style="color:var(--lime)">؟</span></div>` : `<div style="height:84px"></div>`;
    return strike812(lt, q);
  }
  // Scene B: research — 6 to 30 all build muscle
  if (t < S(5)) {
    const lt = t - S(2);
    const cnt = Math.round(6 + 24*ease((t - S(3)) / (T[3].dur*0.9)));
    const fill = ease((t - S(3)) / (T[3].dur*0.9));
    const ok = t >= S(4);
    return `<div style="display:flex;flex-direction:column;align-items:center;gap:36px;width:700px;${rise(lt)}">
      <div class="lbl">📄 الأبحاث</div>
      <div class="big" style="font-size:240px;color:${ok?'var(--lime)':'var(--ink)'}">${t < S(3) ? 6 : cnt}</div>
      <div style="position:relative;width:640px;height:40px;border-radius:20px;background:#232733;direction:ltr">
        <div style="position:absolute;left:0;top:0;height:100%;width:${fill*100}%;border-radius:20px;background:var(--lime)"></div>
      </div>
      <div style="display:flex;justify-content:space-between;width:640px;direction:ltr;font-weight:900;font-size:48px;color:var(--dim)"><span>6</span><span>30</span></div>
      <div style="font-weight:900;font-size:64px;${pop(t - S(4))}">💪 كلهم بيبنوا عضل</div>
    </div>`;
  }
  // Scene C: one condition
  if (t < S(6)) {
    const lt = t - S(5);
    return `<div style="width:420px;height:420px;border-radius:50%;border:16px solid var(--lime);display:flex;align-items:center;justify-content:center;${pop(lt,0,0.3)}">
      <div class="big" style="font-size:280px;color:var(--lime)">1</div></div>`;
  }
  // Scene D: stop with 1-2 reps left
  if (t < S(7)) {
    const lt = t - S(6);
    const filled = Math.floor(10 * ease(lt / (T[6].dur*0.8)));
    return `<div style="display:flex;flex-direction:column;align-items:center;gap:40px;${rise(lt)}">
      <div class="lbl">قرّب من الآخر</div>
      ${dots(12, filled, null, lt, 0)}
      <div style="font-weight:900;font-size:60px;${pop(lt - T[6].dur*0.8)}">فاضلك <span class="hl">1–2</span> بس</div>
    </div>`;
  }
  // Scene E: 12 of 20 = warm-up
  if (t < S(9)) {
    const lt = t - S(7);
    const fill = Math.floor(12 * ease(lt / 1.4));
    const stamp = t >= S(8);
    let segs = '';
    for (let k = 0; k < 20; k++) segs += `<span style="flex:1;height:70px;border-radius:8px;background:${k < fill ? 'var(--lime)' : '#2a2e39'}"></span>`;
    const sp = back((t - S(8) - 0.5) / 0.3);
    return `<div style="position:relative;display:flex;flex-direction:column;align-items:center;gap:30px;width:700px;${rise(lt)}">
      <div style="display:flex;justify-content:space-between;width:680px;direction:ltr;font-weight:900;font-size:70px"><span class="hl">12</span><span style="color:var(--dim)">/ 20</span></div>
      <div style="display:flex;gap:6px;width:680px;direction:ltr">${segs}</div>
      <div class="lbl">كان ممكن تكمل لـ20</div>
      ${stamp ? `<div style="position:absolute;top:110px;font-weight:900;font-size:150px;color:var(--red);border:12px solid var(--red);border-radius:24px;padding:0 40px;background:rgba(13,15,19,.85);opacity:${clamp((t-S(8)-0.5)/0.1)};transform:rotate(-10deg) scale(${2-sp})">تسخين</div>` : ''}
    </div>`;
  }
  // Scene F: not the number — the last two reps
  if (t < S(11)) {
    const lt = t - S(9);
    if (t < S(10)) {
      return `<div style="display:flex;gap:30px;direction:ltr;${rise(lt)}">${[6,10,15,20].map((n,k)=>`<div class="chip" style="color:var(--dim);${pop(lt,k*0.12)}">${n}</div>`).join('')}</div>`;
    }
    const l2 = t - S(10);
    return `<div style="display:flex;flex-direction:column;align-items:center;gap:40px;${rise(l2)}">
      ${dots(10, 8, l2 > 0.4 ? 8 : null, l2, l2)}
      <div style="font-weight:900;font-size:64px;color:var(--red);${pop(l2,0.4)}">↑ آخر عدتين</div>
    </div>`;
  }
  // Scene G: pick the number you like
  if (t < S(13)) {
    const lt = t - S(11);
    const per = T[12].dur / 4;
    return `<div style="display:flex;flex-direction:column;align-items:center;gap:40px;${rise(lt)}">
      <div class="lbl">اختار اللي يريحك</div>
      <div style="display:grid;grid-template-columns:repeat(2,170px);gap:30px;direction:ltr">
        ${[6,10,15,20].map((n,k)=>{ const on = t >= S(12) + k*per; return `<div class="chip" style="${on?'background:var(--lime);color:#0d0f13;':'color:var(--dim);'}transform:scale(${on?1+0.15*(1-ease((t-S(12)-k*per)/0.3)):1})">${n}</div>`; }).join('')}
      </div></div>`;
  }
  // Scene H: loop back to the hook
  if (t < S(14)) return strike812(t - S(13), `<div style="height:84px"></div>`);
  const lt = t - S(14);
  return `<div style="display:flex;flex-direction:column;align-items:center;gap:40px;${rise(lt)}">
    ${dots(10, 8, 8, lt, lt)}
    <div style="font-weight:900;font-size:64px;color:var(--red)">آخر عدتين = صعبين 🔥</div></div>`;
}

window.render = function(t) {
  let i = T.length - 1;
  for (let k = 0; k < T.length; k++) if (t < T[k].start + T[k].dur) { i = k; break; }
  document.getElementById('visual').innerHTML = visual(t);
  document.getElementById('caption').innerHTML = caption(i, t);
  document.getElementById('pbar').style.width = (clamp(t / TOTAL) * 100) + '%';
  const g = 0.5 + 0.5*Math.sin(t*0.8);
  document.getElementById('bgglow').style.background =
    `radial-gradient(900px 700px at ${30+20*g}% ${35+10*g}%, rgba(198,255,61,.10), transparent 70%)`;
};
render(0);
</script>
</body>
</html>
